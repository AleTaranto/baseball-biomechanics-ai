[build-system]
requires = [
    "setuptools>=69",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "baseball-biomechanics-ai"
version = "0.1.0"
description = "Modular platform for baseball swing analysis and biomechanical insights."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "mediapipe>=1.0.1,<2.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4.2",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["backend"]
strict = false
warn_unused_configs = true
show_error_codes = true
